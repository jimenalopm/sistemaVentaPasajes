{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Agregar Tarjeta{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 fw-bold">Agregar nueva tarjeta</h3>

                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow-sm">
                            Guardar tarjeta
                        </button>
                        <a href="{% url 'usuarios:mis_tarjetas' %}" class="btn btn-outline-secondary rounded-pill">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
